<form [formGroup]="fg" (ngSubmit)="guardar(fg.controls['nombre'].value, fg.controls['url'].value)">
  <div class="form-group">
    <label for="nombre">Nombre</label>
    <input type="text" class="form-control" id="nombre" placeholder="Ingresar nombre..." formControlName="nombre">
    <ul>
      <li *ngFor="let r of searchResults">{{ r }}</li>
    </ul>
    <div class="alert alert-danger" *ngIf="fg.controls['nombre'].hasError('required')">Nombre requerido!</div>
    <div class="alert alert-danger" *ngIf="fg.controls['nombre'].hasError('invalidNombre')">Nombre invalido</div>
    <div class="alert alert-danger" *ngIf="fg.controls['nombre'].hasError('minLongNombre')">Nombre debe tener al menos {{ minLongitud }} caracteres</div>
  </div>
  <div class="form-group">
    <label for="imagenUrl">Imagen Url</label>
    <input type="text" class="form-control" id="imagenUrl" placeholder="Ingresar url..." formControlName="url">
  </div>
  <button type="submit" class="btn btn-primary">Guardar!</button>
</form>
