<div class="card-content">
    <div class="card-img">
        <img src="prueba.jpg" alt="jamaica">
        <span>
            <h4>{{ position + 1 }}</h4>
        </span>
    </div>
    <div class="card-desc">
        <h3>{{ destino.nombre }}</h3>
        <p>Servicios</p>
        <ul>
            <li *ngFor="let s of destino.servicios">
                <span [ngSwitch]="s">
                    <i *ngSwitchCase="'desayuno'" style="color: red;">{{ s }}</i>
                    <i *ngSwitchDefault>{{ s }}</i>
                </span>
            </li>
        </ul>

        <div class="votos">
            <a href="#" (click)="voteUp()"><span class="material-icons">thumb_up</span></a>
            <a href="#" (click)="voteDown()"><span class="material-icons">thumb_down</span></a>
            <span>Votos: {{ destino.votes() }}</span>
        </div>

        <div class="acciones">
            <a href="#" class="btn-card" (click)="ir()">Ir</a>
            <span *ngIf="destino.isSelected()">- PREFERIDO -</span>
            <a routerLink="/destino">Ver detalle</a>
        </div>
    </div>
</div>
